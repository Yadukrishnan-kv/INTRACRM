name: intra-leads

services:
  postgres:
    image: postgres:17-alpine
    container_name: intra-leads-postgres
    environment:
      POSTGRES_USER: intra
      POSTGRES_PASSWORD: intra
      POSTGRES_DB: intra_leads
    ports:
      - "5432:5432"
    volumes:
      - intra_pg_data:/var/lib/postgresql/data
      - ./docs/data/sql:/sql:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/00-apply.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intra -d intra_leads"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: intra-leads-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - intra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: intra-leads-api:local
    container_name: intra-leads-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_NAME: intra-leads-api
      APP_PORT: 3000
      APP_URL: http://localhost:3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://intra:intra@postgres:5432/intra_leads?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      JWT_ACCESS_SECRET: local-dev-access-secret
      JWT_REFRESH_SECRET: local-dev-refresh-secret
      LOG_PRETTY: "false"
      SWAGGER_ENABLED: "true"
      SEED_ENABLED: "false"
      STORAGE_ROOT: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - intra_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: intra-leads-api:local
    container_name: intra-leads-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_NAME: intra-leads-worker
      APP_PORT: 3000
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://intra:intra@postgres:5432/intra_leads?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      JWT_ACCESS_SECRET: local-dev-access-secret
      JWT_REFRESH_SECRET: local-dev-refresh-secret
      LOG_PRETTY: "false"
      SWAGGER_ENABLED: "false"
      STORAGE_ROOT: /app/uploads
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    restart: unless-stopped
    profiles: ["workers"]

volumes:
  intra_pg_data:
  intra_redis_data:
  intra_uploads:

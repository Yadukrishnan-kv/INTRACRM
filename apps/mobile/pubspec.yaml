name: intra_leads
description: INTRA LEADS mobile CRM
publish_to: none
version: 1.0.2+4

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  go_router: ^16.0.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.0.0
  uuid: ^4.5.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  crypto: ^3.0.6
  cryptography: ^2.7.0
  safe_device: ^1.1.8
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Used by test/features/comms/comms_launcher_test.dart to stand in for the
  # url_launcher plugin and exercise its documented failure modes.
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Launcher icons are generated from assets/branding/ by
# `dart run flutter_launcher_icons`. Two things need a hand after re-running it:
#  - v0.14.4 overwrites ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS
#    in ios/Runner.xcodeproj/project.pbxproj with "AppIcon"; reset it to YES.
#  - web/icons/Icon-maskable-*.png are re-emitted full-bleed, which the PWA
#    circular mask clips; they are kept padded to the 80% maskable safe zone.
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  # The foreground source already sizes the mark inside the 66/108 safe zone,
  # so the package's default 16% inset would shrink it twice over.
  adaptive_icon_foreground_inset: 0
  ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#0A1417"
  macos:
    generate: true
